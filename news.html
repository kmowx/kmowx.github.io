<!DOCTYPE html>
<html lang="ja">
<head>
<script>
(function(){try{var t=localStorage.getItem('kmowx-theme');if(t==='light'||t==='dark'){document.documentElement.setAttribute('data-theme',t);}}catch(e){}})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
<meta name="color-scheme" content="light dark">
<link rel="icon" type="image/jpeg" href="images/favicon.jpg">
<link rel="apple-touch-icon" href="images/favicon.jpg">
<meta name="description" content="kmowxのホームページ・ゲームに関するお知らせ一覧。">
<meta property="og:type" content="website">
<meta property="og:title" content="News | kmowxのホームページ">
<meta property="og:description" content="kmowxのホームページ・ゲームに関するお知らせ一覧。">
<meta property="og:url" content="https://kmowx.github.io/news.html">
<meta property="og:image" content="https://kmowx.github.io/images/favicon.jpg">
<meta property="og:site_name" content="kmowxのホームページ">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="News | kmowxのホームページ">
<meta name="twitter:description" content="kmowxのホームページ・ゲームに関するお知らせ一覧。">
<meta name="twitter:image" content="https://kmowx.github.io/images/favicon.jpg">
<title>News | kmowxのホームページ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16161d;
  --paper:#faf9f5;
  --paper-dim:#f0efe9;
  --pop-music:#ff4d8d;
  --pop-illust:#ffd23f;
  --pop-game:#3fd9ff;
  --line: rgba(22,22,29,0.12);
  --radius: 14px;
  --paper-rgb: 250, 249, 245;
  --surface: #ffffff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#f2f1ec;
    --paper:#151519;
    --paper-dim:#1f1f26;
    --line: rgba(255,255,255,0.14);
    --paper-rgb: 21, 21, 25;
    --surface: #1c1c23;
  }
}
:root[data-theme="dark"]{
  --ink:#f2f1ec;
  --paper:#151519;
  --paper-dim:#1f1f26;
  --line: rgba(255,255,255,0.14);
  --paper-rgb: 21, 21, 25;
  --surface: #1c1c23;
}
*{box-sizing:border-box; margin:0; padding:0;}
html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; }
html{scroll-behavior:smooth; background:var(--paper); transition: background-color .2s ease;}
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto;}
  *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Noto Sans JP', sans-serif;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  transition: background-color .2s ease, color .2s ease;
}
.display{ font-family:'Zen Kaku Gothic New', sans-serif; font-weight:900; letter-spacing:0.01em; }
.mono{ font-family:'Space Grotesk', monospace; letter-spacing:0.02em; }

a{ color:inherit; text-decoration:none; }
img{ max-width:100%; display:block; }
section{ padding: 96px 24px; max-width:1080px; margin:0 auto; }
.eyebrow{
  font-family:'Space Grotesk', monospace;
  font-size:13px;
  letter-spacing:0.18em;
  text-transform:uppercase;
  opacity:0.55;
  margin-bottom:14px;
  display:flex; align-items:center; gap:10px;
}
.eyebrow::before{ content:""; width:22px; height:2px; background:currentColor; opacity:0.5; }

/* ---------- NAV ---------- */
header{
  position:fixed; top:0; left:0; right:0; z-index:50;
  display:flex; align-items:center; justify-content:space-between;
  padding: 18px 28px;
  backdrop-filter: blur(10px);
  background: rgba(var(--paper-rgb), 0.72);
  border-bottom:1px solid var(--line);
}
.logo{
  display:flex; align-items:center; gap:12px;
  font-family:'Zen Kaku Gothic New', sans-serif;
  font-weight:900; letter-spacing:0.01em; font-size:22px;
}
.logo-mark{
  width:40px; height:40px; border-radius:50%;
  object-fit:cover;
  border:1px solid var(--line);
}
nav ul{ display:flex; gap:28px; list-style:none; }
nav a{
  font-size:14px; font-weight:500; opacity:0.7;
  position:relative; padding:4px 0;
  transition: opacity .2s ease;
}
nav a:hover{ opacity:1; }
nav a::after{
  content:""; position:absolute; left:0; bottom:-2px;
  width:0; height:2px; background:var(--ink);
  transition: width .25s ease;
}
nav a:hover::after{ width:100%; }
.header-right{ display:flex; align-items:center; gap:14px; }
.theme-toggle{
  background:none; border:1px solid var(--line); border-radius:50%;
  width:36px; height:36px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; font-size:15px; color:var(--ink);
  transition: background-color .2s ease, border-color .2s ease;
}
.theme-toggle:hover{ background:var(--paper-dim); }
.nav-toggle{ display:none; }

/* ---------- HERO (index) ---------- */
.hero{
  min-height:92svh;
  display:flex; flex-direction:column; justify-content:center;
  padding-top:140px;
  max-width:1080px;
}
.hero h1{
  font-size:clamp(40px, 8vw, 88px);
  line-height:1.1;
  margin-bottom:48px;
}
.hero h1 .accent-music{ color:var(--pop-music); }
.hero h1 .accent-illust{ color:#c99a00; }
.hero h1 .accent-game{ color:#0090ab; }
.hero .tagline{
  font-family:'Space Grotesk', monospace;
  font-size:13px; letter-spacing:0.18em; text-transform:uppercase; opacity:0.55;
  margin-bottom:16px;
}

/* mixer / channel strips — signature element */
.mixer{
  display:flex; gap:14px; align-items:flex-end;
  margin-top:8px;
}
.channel{
  flex:1; max-width:180px;
  border:1px solid var(--line);
  border-radius: var(--radius);
  background: rgba(var(--paper-rgb), 0.55);
  padding:16px 14px 20px;
  cursor:pointer;
  transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease, background-color .2s ease;
}
.channel:hover, .channel:focus-visible{
  transform: translateY(-6px);
  border-color: var(--ink);
  box-shadow: 0 14px 28px -18px rgba(22,22,29,0.35);
  outline: none;
}
.channel:focus-visible{ outline:2px solid var(--ink); outline-offset:3px; }
.channel-label{
  font-family:'Space Grotesk', monospace;
  font-size:12px; letter-spacing:0.1em;
  display:flex; justify-content:space-between; align-items:center;
  margin-bottom:14px; opacity:0.8;
}
.channel-dot{ width:8px; height:8px; border-radius:50%; }
.fader-track{
  position:relative;
  width:100%; height:120px;
  border-radius:999px;
  background: var(--paper-dim);
  overflow:hidden;
}
.fader-fill{
  position:absolute; bottom:0; left:0; right:0;
  border-radius:999px;
  animation: pulse-fader 3.6s ease-in-out infinite;
}
.channel[data-c="music"] .fader-fill{ background: var(--pop-music); height:64%; animation-delay:0s;}
.channel[data-c="illust"] .fader-fill{ background: var(--pop-illust); height:48%; animation-delay:.4s;}
.channel[data-c="game"] .fader-fill{ background: var(--pop-game); height:72%; animation-delay:.8s;}
@keyframes pulse-fader{
  0%,100%{ filter:brightness(1); }
  50%{ filter:brightness(1.12); }
}
.channel-name{ margin-top:14px; font-weight:700; font-size:14px; }
.channel-sub{ font-size:12px; opacity:0.55; margin-top:2px; }

.scroll-hint{
  margin-top:64px; font-size:12px; opacity:0.5;
  font-family:'Space Grotesk', monospace;
  display:flex; align-items:center; gap:8px;
}
.scroll-hint .line{ width:32px; height:1px; background:currentColor; animation: scrollline 2s ease-in-out infinite; }
@keyframes scrollline{ 0%,100%{ transform:scaleX(1); opacity:.5; } 50%{ transform:scaleX(1.6); opacity:1; } }

/* ---------- SECTION HEAD ---------- */
.section-head{
  display:flex; justify-content:space-between; align-items:flex-end;
  margin-bottom:44px; flex-wrap:wrap; gap:16px;
}
.section-head h2{ font-size: clamp(28px, 4vw, 40px); margin-bottom:0; }
.more-link{
  font-family:'Space Grotesk', monospace;
  font-size:13px; font-weight:600; letter-spacing:0.04em;
  display:inline-flex; align-items:center; gap:6px;
  border-bottom:1px solid var(--ink);
  padding-bottom:2px;
  transition: opacity .2s ease, gap .2s ease;
}
.more-link:hover{ opacity:0.6; gap:10px; }

/* ---------- ABOUT ---------- */
.about-grid{
  display:grid; grid-template-columns: 240px 1fr; gap:48px; align-items:center;
}
.about-photo{
  width:100%; height:auto; display:block;
  border-radius:50%;
  border:1px solid var(--line);
  flex-shrink:0;
}
.about-name{ font-size: clamp(32px, 6vw, 56px); margin-bottom:20px; }

/* ---------- CARD GRID ---------- */
.card-grid{ display:grid; gap:20px; grid-template-columns: repeat(3, 1fr); }
.card{
  border:1px solid var(--line);
  border-radius: var(--radius);
  overflow:hidden;
  background:var(--surface);
  transition: transform .25s ease, box-shadow .25s ease, background-color .2s ease;
}
.card:hover{ transform: translateY(-5px); box-shadow: 0 16px 30px -20px rgba(22,22,29,0.4); }
.card-art{
  aspect-ratio: 4/3;
  display:flex; align-items:center; justify-content:center;
  font-family:'Space Grotesk', monospace; font-size:12px;
  color:rgba(255,255,255,0.85);
}
.card-body{ padding:16px 18px 20px; }
.card-tag{
  font-family:'Space Grotesk', monospace; font-size:11px;
  letter-spacing:0.08em; opacity:0.55; margin-bottom:6px; text-transform:uppercase;
}
.card-title{ font-weight:700; font-size:15px; }

.waveform{ display:flex; align-items:flex-end; gap:3px; height:40px; }
.waveform span{ width:4px; background:rgba(255,255,255,0.85); border-radius:2px; animation: bar 1.6s ease-in-out infinite; }
@keyframes bar{ 0%,100%{ transform:scaleY(0.4);} 50%{ transform:scaleY(1);} }

/* ---------- GAME feature (index, compact) ---------- */
.feature{
  display:grid; grid-template-columns: 1fr 1fr; gap:48px; align-items:center;
  border:1px solid var(--line); border-radius: var(--radius);
  padding:40px; background:var(--surface);
}
.feature-visual{
  aspect-ratio: 4/3; border-radius: 10px;
  background:
    radial-gradient(circle at 30% 30%, rgba(255,77,141,0.18), transparent 55%),
    radial-gradient(circle at 70% 60%, rgba(63,217,255,0.22), transparent 55%),
    var(--ink);
  position:relative; overflow:hidden;
}
.target{ position:absolute; width:34px; height:34px; border-radius:50%; border:2px solid var(--pop-game); }
.target::after{ content:""; position:absolute; inset:8px; border-radius:50%; background:var(--pop-game); }
.target.red{ border-color:var(--pop-music); }
.target.red::after{ background:var(--pop-music); }
.t1{ top:20%; left:15%; animation: drift 5s ease-in-out infinite; }
.t2{ top:55%; left:60%; animation: drift 4.2s ease-in-out infinite reverse; }
.t3{ top:70%; left:20%; animation: drift 6s ease-in-out infinite; }
@keyframes drift{ 0%,100%{ transform:translate(0,0);} 50%{ transform:translate(12px,-10px);} }
.feature-title{ font-size:20px; font-weight:700; margin-bottom:10px; }
.feature-desc{ opacity:.7; font-size:14px; margin-bottom:20px; }

/* ---------- CONTACT ---------- */
#contact{ padding-bottom:140px; }
.contact-box{
  border-radius: var(--radius);
  background:#16161d; color:#faf9f5;
  padding:64px 48px; text-align:center;
}
.contact-box h2{ color:#faf9f5; margin-bottom:32px; }
.social-row{ display:flex; justify-content:center; gap:14px; flex-wrap:wrap; }
.social-pill{
  border:1px solid rgba(250,249,245,0.3);
  padding:10px 20px; border-radius:999px; font-size:13px; font-weight:500;
  transition: background .2s ease, border-color .2s ease;
}
.social-pill:hover{ background:rgba(250,249,245,0.12); border-color:var(--paper); }
.social-pill.light{ border-color:var(--line); color:var(--ink); }
.social-pill.light:hover{ background:var(--paper-dim); border-color:var(--ink); }

footer{ text-align:center; font-size:12px; opacity:0.4; padding:28px; font-family:'Space Grotesk',monospace; }

/* ---------- DETAIL PAGES ---------- */
.detail-hero{ padding-top:160px; max-width:1080px; }
.back-link{
  font-family:'Space Grotesk', monospace; font-size:13px; opacity:0.55;
  display:inline-flex; align-items:center; gap:6px; margin-bottom:24px;
  transition: opacity .2s ease;
}
.back-link:hover{ opacity:1; }
.detail-title{ font-size:clamp(32px,6vw,56px); margin-bottom:16px; }
.detail-lead{ max-width:560px; font-size:15px; }
.detail-thumb{
  margin-top:40px; border-radius: var(--radius); aspect-ratio: 16/9;
  background:
    radial-gradient(circle at 30% 30%, rgba(255,77,141,0.18), transparent 55%),
    radial-gradient(circle at 70% 60%, rgba(63,217,255,0.22), transparent 55%),
    var(--ink);
  position:relative; overflow:hidden;
}
.detail-content{ padding-top:0; }
.detail-list{ list-style:none; margin-top:24px; max-width:520px; }
.detail-list li{ padding:12px 0; border-top:1px solid var(--line); font-size:14px; display:flex; gap:12px; }
.detail-list li:last-child{ border-bottom:1px solid var(--line); }
.detail-list b{ font-family:'Space Grotesk',monospace; opacity:0.5; font-weight:600; min-width:64px; }
.empty-note{
  margin-top:16px; font-size:13px; opacity:0.4;
  border:1px dashed var(--line); border-radius:10px; padding:24px; max-width:520px;
}

/* ---------- responsive ---------- */
@media (max-width: 860px){
  .card-grid{ grid-template-columns: 1fr 1fr; }
  .feature{ grid-template-columns: 1fr; padding:26px; }
}
@media (max-width: 620px){
  nav ul{
    position:fixed; top:64px; left:0; right:0;
    flex-direction:column; gap:0;
    background:var(--paper); border-bottom:1px solid var(--line);
    max-height:0; overflow:hidden; transition: max-height .3s ease;
  }
  nav ul.open{ max-height: calc(100vh - 64px); overflow-y:auto; }
  nav li{ border-top:1px solid var(--line); }
  nav a{ display:block; padding:16px 24px; }
  .nav-toggle{ display:block; background:none; border:none; font-size:20px; cursor:pointer; color:var(--ink); }
  .mixer{ flex-wrap:wrap; }
  .channel{ max-width:none; flex:1 1 30%; }
  .card-grid{ grid-template-columns: 1fr; }
  section{ padding:72px 20px; }
  .contact-box{ padding:44px 24px; }
  .about-grid{ grid-template-columns: 1fr; }
}


/* ---------- NEWS ---------- */
.news-list{ list-style:none; margin-top:8px; max-width:640px; }
.news-list li{
  display:flex; gap:24px; align-items:baseline;
  padding:14px 0; border-top:1px solid var(--line);
  font-size:14px;
}
.news-list li:last-child{ border-bottom:1px solid var(--line); }
.news-date{
  font-family:'Space Grotesk', monospace; font-size:13px;
  opacity:0.5; flex-shrink:0; min-width:96px;
}
</style>
</head>
<body>

<header>
  <a class="logo" href="index.html"><img class="logo-mark" src="images/profile.png" alt="" aria-hidden="true" width="309" height="309">kmowx</a>
  <div class="header-right">
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="ダークモード切り替え">🌙</button>
    <button class="nav-toggle" id="navToggle" aria-label="メニューを開く" aria-expanded="false">☰</button>
    <nav>
      <ul id="navList">
        <li><a href="index.html#news">News</a></li>
        <li><a href="index.html#about">About</a></li>
        <li><a href="index.html#music">Music</a></li>
        <li><a href="index.html#illust">Illust</a></li>
        <li><a href="index.html#game">Game</a></li>
        <li><a href="index.html#links">Links</a></li>
      </ul>
    </nav>
  </div>
</header>

<main>
  <section class="detail-hero">
    <a class="back-link" href="index.html">← Home</a>
    <div class="eyebrow">News</div>
    <h1 class="display detail-title">News</h1>
  </section>

  <section class="detail-content">
    <ul class="news-list">
      <li><span class="news-date">2026.09.04</span><span class="news-text">kmowxのホームページ「Kmowx's Park」運用開始</span></li>
    </ul>
  </section>
</main>

<footer>© 2026 kmowx</footer>

<script>
(function(){try{var t=localStorage.getItem('kmowx-theme');if(t==='light'||t==='dark'){document.documentElement.setAttribute('data-theme',t);}}catch(e){}})();
</script>
</body>
</html>
